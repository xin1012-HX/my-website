<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的建筑作品集</title>
    <style>
        /* 基础样式复位 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif; /* 现代极简字体 */
            background-color: #FAFAFA; /* 浅灰白背景，不刺眼 */
            color: #333;
            line-height: 1.6;
        }

        /* 顶部导航栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 10%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            text-decoration: none;
            color: #888;
            margin-left: 30px;
            font-size: 14px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #000;
        }

        /* 简短自我介绍 */
        .intro {
            padding: 40px 10%;
            font-size: 18px;
            max-width: 800px;
            color: #555;
        }

        /* 作品网格展示区 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* 自动响应式网格 */
            gap: 20px;
            padding: 0 10% 60px 10%;
        }

        .project {
            overflow: hidden;
            background-color: #eee;
            cursor: pointer;
        }

        .project img {
            width: 100%;
            height: 300px;
            object-fit: cover; /* 保证图片不变形 */
            transition: transform 0.5s ease;
        }

        .project:hover img {
            transform: scale(1.05); /* 鼠标悬停时图片微微放大 */
        }

        .project-info {
            padding: 15px 0;
        }

        .project-title {
            font-size: 16px;
            font-weight: bold;
        }

        .project-category {
            font-size: 12px;
            color: #888;
        }

        /* 底部信息 */
        footer {
            text-align: center;
            padding: 40px 0;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">XIN HE</div>
        <nav>
            <a href="#">作品 GALLERY</a>
            <a href="#">关于 ABOUT</a>
            <a href="#">联系 CONTACT</a>
        </nav>
    </header>

    <section class="intro">
        <p>你好，我是一名建筑设计师。这里记录了我在空间形态、材料与光影方面的设计探索。</p>
    </section>

    <section class="gallery">
        <div class="project">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="建筑项目1">
            <div class="project-info">
                <div class="project-title">城市美术馆改造</div>
                <div class="project-category">公共建筑 / 2023</div>
            </div>
        </div>

        <div class="project">
            <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="建筑项目2">
            <div class="project-info">
                <div class="project-title">悬崖边的住宅</div>
                <div class="project-category">私人居住 / 2024</div>
            </div>
        </div>

        <div class="project">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="建筑项目3">
            <div class="project-info">
                <div class="project-title">可持续木构展馆</div>
                <div class="project-category">参数化设计 / 2025</div>
            </div>
        </div>
    </section>

    <footer>
        &copy; 2026 Your Name. All Rights Reserved.
    </footer>

</body>
</html>
